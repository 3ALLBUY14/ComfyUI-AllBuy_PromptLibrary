[pytest]
# 兜底：在插件根裸跑 `pytest`（无参数，走本文件 testpaths）时也能通过。
# 插件根必须有 __init__.py（ComfyUI 自定义节点要求），但目录名含连字符、不是合法
# Python 标识符：无参数时 rootdir=插件根，pytest 9 会把根建为 Package 并在 setup
# 时导入其 __init__.py，包内相对导入（from .nodes import ...）离开 ComfyUI 运行时
# 必炸 → 全部用例收集失败（机制详见 tests/pytest.ini 头注释）。
# --confcutdir=tests 把 conftest 加载与收集父目录链同时截断在 tests/，根退出收集树；
# 显式 `pytest tests/` 本就以 tests/ 为 rootdir，行为不变。
addopts = --confcutdir=tests
testpaths = tests
